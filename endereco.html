<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Endereço</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="formEndereco">
    <h1>Cadastro de Endereço</h1>

    <div class="campo">
      <label for="cep">CEP *</label>
      <input type="text" id="cep" maxlength="9" placeholder="00000-000">
    </div>

    <div class="campo">
      <label for="logradouro">Logradouro *</label>
      <input type="text" id="logradouro" placeholder="Rua, Avenida...">
    </div>

    <div class="linha">
      <div class="campo">
        <label for="numero">Número *</label>
        <input type="text" id="numero" placeholder="123">
      </div>
      <div class="campo">
        <label for="uf">UF *</label>
        <input type="text" id="uf" maxlength="2" placeholder="SP">
      </div>
    </div>

    <div class="campo">
      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" placeholder="Apto, Bloco...">
    </div>

    <button type="submit">Cadastrar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
